services:
  headscale:
    image: docker.io/headscale/headscale:0.29.2
    container_name: headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - ./data:/var/lib/headscale
    command: serve
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
