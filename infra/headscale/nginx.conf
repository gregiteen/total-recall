upstream headscale_backend {
    zone headscale_backend 64k;
    server 127.0.0.1:8081 max_fails=1 fail_timeout=5s;
    keepalive 2;
}

map $http_upgrade $headscale_connection_upgrade {
    default keep-alive;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name headscale.ultrachat.app;

    location = /generate_204 {
        return 204;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name headscale.ultrachat.app;

    ssl_certificate /etc/letsencrypt/live/app.ultrachat.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ultrachat.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $headscale_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header True-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://headscale_backend;
    }
}
