# Total Recall Security Configuration
# Copy to ~/.agent/config/security.yml and customize

# Privacy controls
privacy:
  # Nodes with privacy: local_only are NEVER sent to frontier API
  enforce_local_only: true

  # Default export policy for frontier API calls
  # Options: always | ask_per_skill | never
  allow_frontier_export: ask_per_skill

# YOLO Mode (fully autonomous operation)
yolo_mode: false

# Dashboard authentication
dashboard:
  # Set a bcrypt-hashed password (generate with: npx total-recall hash-password)
  password_hash: null

  # Session TTL in hours
  session_ttl_hours: 24

# API authentication
api:
  # Personal Access Tokens are stored as hashes in ~/.agent/config/keys.jsonl.
  # Generate one with: npx total-recall generate-pat --name "codex"
  #
  # Static PATs in this YAML file are disabled by default because they are
  # plaintext secrets. Use keys.jsonl unless you are doing a temporary migration.
  allow_static_pats: false
  pats: []

# Rate limiting
rate_limits:
  api_requests_per_minute: 60
  mcp_requests_per_minute: 120

# Network binding
bind:
  # Express should stay private behind Caddy/Cloudflare. Do not expose :3000.
  host: "127.0.0.1"
  port: 3000
  allow_public_bind: false

network:
  # Production requests must arrive through HTTPS at Caddy/Cloudflare.
  require_https: true

  # Keep public health checks closed; localhost and authenticated requests work.
  public_health: false

  # Browser cross-origin callers. Same-origin dashboard traffic does not need CORS.
  allowed_origins: []
