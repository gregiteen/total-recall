# Frontier API Configuration
# Copy to ~/.agent/config/frontier.yml and customize
#
# The frontier model handles tasks that exceed the local model's confidence.
# Total Recall routes to frontier when confidence < threshold.

# ----------------------------------------------------------------------------
# Provider: Gemini (Default — via Google AI Studio API key)
# ----------------------------------------------------------------------------
provider: gemini
endpoint: https://generativelanguage.googleapis.com/v1beta/chat/completions
model: gemini-3.5-flash
# Set your API key from https://aistudio.google.com/apikey
api_key: ${GOOGLE_API_KEY}

# Inference settings
temperature: 0.1
max_tokens: 8192

# ----------------------------------------------------------------------------
# Alternative: DeepSeek (BYOK — Bring Your Own Key)
# ----------------------------------------------------------------------------
# provider: deepseek
# endpoint: https://api.deepseek.com/v1/chat/completions
# model: deepseek-chat
# api_key: YOUR_DEEPSEEK_API_KEY

# ----------------------------------------------------------------------------
# Alternative: OpenAI
# ----------------------------------------------------------------------------
# provider: openai
# endpoint: https://api.openai.com/v1/chat/completions
# model: gpt-4o
# api_key: YOUR_OPENAI_API_KEY

# Local kernel (Ollama or remote GPU)
# This endpoint is used for local/cheap inference before escalating to frontier.
# Change to your cloud URL if Ollama runs remotely.
local:
  endpoint: http://127.0.0.1:11434/v1/chat/completions
  model: gemma4:26b
  # For remote deployments, use HTTPS:
  # endpoint: https://your-cloud-gpu.example.com/v1/chat/completions

# Confidence routing
# Tasks below this confidence threshold escalate to the frontier API
confidence_threshold: 0.7

# Monthly budget cap for frontier API calls (USD)
monthly_budget_usd: 15.00
