name: Community Submission Gate

on:
  pull_request:
    paths:
      - '.agent/skills/**'
      - 'scaffold/.agent/skills/**'

jobs:
  validate-submission:
    name: Validate skill/recipe submission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Find changed SKILL.md files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -E '(SKILL|skill)\.md$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$FILES" | grep -c . || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Lint changed skill files
        if: steps.changed.outputs.count != '0'
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Linting: $file"
            node bin/total-recall.mjs lint "$file"
          done <<'FILELIST'
          ${{ steps.changed.outputs.files }}
          FILELIST

      - name: Validate frontmatter (schema_version and required fields)
        if: steps.changed.outputs.count != '0'
        run: |
          node --input-type=module <<'SCRIPT'
          import { readFileSync, existsSync } from 'fs';
          const files = `${{ steps.changed.outputs.files }}`.split('\n').filter(Boolean);
          let errors = 0;
          const REQUIRED = ['name', 'description', 'type', 'schema_version'];

          for (const file of files) {
            if (!existsSync(file)) continue;
            const content = readFileSync(file, 'utf8');
            const match = content.match(/^---\n([\s\S]+?)\n---/);
            if (!match) {
              console.error(`❌ ${file}: No YAML frontmatter found`);
              errors++; continue;
            }
            const fm = match[1];
            for (const field of REQUIRED) {
              if (!fm.includes(field + ':')) {
                console.error(`❌ ${file}: Missing required field: ${field}`);
                errors++;
              }
            }
            if (!fm.includes('schema_version: 2')) {
              console.error(`❌ ${file}: schema_version must be 2`);
              errors++;
            } else {
              console.log(`✅ ${file}: frontmatter OK`);
            }
          }
          if (errors > 0) process.exit(1);
          SCRIPT

      - name: Run vitest suite (regression guard)
        run: npx vitest run
