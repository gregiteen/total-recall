agents:
  - name: antigravity
    binary: antigravity
    flags: --sandbox=false --yolo -o json
    priority: 1
    enabled: true
    exec: flag

  - name: grok
    binary: grok
    # Grok Build TUI: -p single-turn, plain text for TR parser
    flags: --output-format plain --always-approve --permission-mode bypassPermissions
    priority: 2
    enabled: true
    exec: flag

  - name: claude
    binary: claude
    flags: --output-format json --permission-mode bypassPermissions --setting-sources local --tools ""
    priority: 3
    enabled: true
    exec: flag
  - name: codex
    binary: codex
    flags: --sandbox workspace-write --json --skip-git-repo-check
    priority: 4
    enabled: true
    exec: subcommand
timeout: 300
max_retries: 2
