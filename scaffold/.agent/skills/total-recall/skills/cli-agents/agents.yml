agents:
  - name: antigravity
    binary: antigravity
    flags: --sandbox=false --yolo -o json
    priority: 1
    enabled: true
    exec: flag
  - name: gemini
    binary: gemini
    flags: --sandbox=false --yolo -o json
    priority: 2
    enabled: true
    exec: flag
  - name: claude
    binary: claude
    flags: --output-format json --permission-mode bypassPermissions
    priority: 3
    enabled: true
    exec: flag
  - name: codex
    binary: codex
    flags: --full-auto --json
    priority: 4
    enabled: true
    exec: subcommand
timeout: 300
max_retries: 2
