<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background glow / dark rounded container for dark & light browser tabs -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="url(#bg)" stroke="rgba(96,165,250,0.3)" stroke-width="2"/>
  
  <!-- Isometric Cube -->
  <g transform="translate(50, 50)" filter="url(#shadow)">
    <!-- Top Face (Aperture / Shutter) -->
    <polygon points="0,-36 31,-18 0,0 -31,-18" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Top Face Aperture Blades -->
    <polygon points="0,-26 12,-19 0,-12 -12,-19" fill="#0b1220" />
    <path d="M 0,-26 L 6,-15 M 12,-19 L 0,-12 M 0,-12 L -6,-23 M -12,-19 L 0,-26" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Face (Light Blue with Camera) -->
    <polygon points="-31,-18 0,0 0,36 -31,18" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Camera Icon on Left Face -->
    <g transform="translate(-15, 8) skewY(30) scale(0.65)">
      <!-- Camera Body -->
      <path d="M -12,-6 L -7,-6 L -5,-10 L 5,-10 L 7,-6 L 12,-6 C 14,-6 15,-5 15,-3 L 15,9 C 15,11 14,12 12,12 L -12,12 C -14,12 -15,11 -15,9 L -15,-3 C -15,-5 -14,-6 -12,-6 Z" fill="#ffffff" />
      <!-- Camera Lens -->
      <circle cx="0" cy="3" r="5" fill="#3b82f6" />
      <circle cx="0" cy="3" r="2.5" fill="#ffffff" />
    </g>

    <!-- Right Face (Darker Blue with Lock) -->
    <polygon points="0,0 31,-18 31,18 0,36" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Lock Icon on Right Face -->
    <g transform="translate(15, 8) skewY(-30) scale(0.7)">
      <!-- Lock Shackle -->
      <path d="M -6,-3 L -6,-9 C -6,-13 6,-13 6,-9 L 6,-3" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <!-- Lock Body -->
      <rect x="-9" y="-3" width="18" height="15" rx="3" fill="#ffffff"/>
      <!-- Keyhole -->
      <circle cx="0" cy="3" r="2" fill="#1e3a8a"/>
      <polygon points="-1,3 1,3 1.5,8 -1.5,8" fill="#1e3a8a"/>
    </g>
  </g>
</svg>